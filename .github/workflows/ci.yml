name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.11', '3.13']
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install test dependency
        run: python -m pip install --quiet pytest

      - name: Compile Python sources
        run: python -m compileall -q skill/scripts tools tests

      - name: Node syntax check (connector + universal MCP)
        run: |
          node --check connector/server.mjs
          node --check connector/ask.mjs
          node --check mcp/server.mjs
          node --check mcp/ask.mjs

      - name: MCP core in sync with connector
        run: |
          python tools/sync_core.py
          git diff --exit-code -- mcp/server.mjs mcp/ask.mjs mcp/guide.json mcp/scenarios.json mcp/data/actions.json mcp/data/domains/

      - name: Offline verification (three editions: structure / privacy / readonly / scenarios / packaging)
        run: python tools/verify_offline.py

      - name: Unit tests
        run: python -m pytest tests/ -q

  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No binaries, no credentials, no real customer data
        run: python tools/scan_secrets.py
