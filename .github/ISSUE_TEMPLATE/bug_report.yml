name: 报告问题 / Bug report
description: 遇到问题？按这个模板填，注意先打码敏感信息
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请**先打码** token、账号名、公司名、店铺 ID、序列号、客户与物流信息，再提交。
        安全问题不要用公开 Issue，见 SECURITY.md。
  - type: dropdown
    id: form
    attributes:
      label: 哪个形态
      options:
        - 技能包（Python / skill）
        - 连接器（Node / MCP / connector）
        - 打包或安装
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、期望什么、实际什么
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、水宝版本、Python 或 Node 版本、技能/连接器版本
      placeholder: |
        Windows 11 / 水宝 2.0.611181 / Python 3.13 / 技能 5.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关输出（已打码）
      render: shell
  - type: checkboxes
    id: check
    attributes:
      label: 确认
      options:
        - label: 我已打码所有敏感信息
          required: true
        - label: 我已先跑过 python tools/verify_offline.py
          required: false
